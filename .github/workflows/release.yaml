name: Release
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - custom_components/bord_gais_energy/manifest.json
      - CHANGELOG.md
      - .github/workflows/release.yaml
      - .github/scripts/release_metadata.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bge-release
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - id: release
        name: Validate version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: python .github/scripts/release_metadata.py
  checks:
    needs: metadata
    uses: ./.github/workflows/checks.yaml
  publish:
    needs: [metadata, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/release_metadata.py
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          args=("$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
                --title "Bord Gáis Energy Account $RELEASE_TAG" --notes-file "$NOTES_FILE")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "${args[@]}"
